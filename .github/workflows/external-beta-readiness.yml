name: External beta release readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/m7-external-beta-release-readiness]

permissions:
  contents: read
  checks: write

jobs:
  verify-external-beta-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - name: Run project verification
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log

      - name: Publish verification diagnostic
        if: always() && steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('verify.log', 'utf8').slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'M7 verification diagnostic',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'npm run verify failed',
                summary: `\`\`\`text\n${output}\n\`\`\``
              }
            });

      - name: Fail when project verification fails
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Run external beta operations tests
        id: operations_tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:ops 2>&1 | tee operations-tests.log

      - name: Publish operations test diagnostic
        if: always() && steps.operations_tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('operations-tests.log', 'utf8').slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'M7 operations test diagnostic',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'npm run test:ops failed',
                summary: `\`\`\`text\n${output}\n\`\`\``
              }
            });

      - name: Fail when operations tests fail
        if: steps.operations_tests.outcome == 'failure'
        run: exit 1

      - run: docker compose --env-file deployment/external-beta.env.example -f deployment/compose.external-beta.yml config --quiet
      - run: docker build --target migrate -t xinyu-migrate:ci .
      - run: docker build --target api -t xinyu-api:ci .
      - run: docker build --target web -t xinyu-web:ci .
